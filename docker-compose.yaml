services:
  frontend:
    image: ${MINDRAILS_FRONTEND_IMAGE:-haarp/mindrails-frontend:latest}
    pull_policy: ${MINDRAILS_IMAGE_PULL_POLICY:-always}
    container_name: mindrails-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MINDRAILS_BACKEND_BASE_URL: ${MINDRAILS_BACKEND_BASE_URL:-http://localhost:8080}
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/backend-config')
          .then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    image: ${MINDRAILS_BACKEND_IMAGE:-haarp/mindrails-backend:latest}
    pull_policy: ${MINDRAILS_IMAGE_PULL_POLICY:-always}
    container_name: mindrails-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - path: ${MINDRAILS_BACKEND_ENV_FILE:-.env}
        format: raw
    environment:
      MINDRAILS_FILE_STORAGE_DIRECTORY: ${MINDRAILS_WORKSPACE_DIR:-/opt/mindrails}/data
    working_dir: ${MINDRAILS_WORKSPACE_DIR:-/opt/mindrails}
    user: ${MINDRAILS_CONTAINER_USER:-10001:10001}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - type: bind
        source: ${MINDRAILS_FILE_STORAGE_DIRECTORY:-./data}
        target: ${MINDRAILS_WORKSPACE_DIR:-/opt/mindrails}/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  mysql:
    image: mysql:8.4
    container_name: mindrails-mysql
    labels:
      com.mindrails.service: mysql
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:3306:3306'
    env_file: db/.env
    environment:
      MYSQL_DATABASE: mindrails
      MYSQL_USER: ${MINDRAILS_MYSQL_USERNAME:-mindrails_app}
      MYSQL_PASSWORD: ${MINDRAILS_MYSQL_PASSWORD:?Set MINDRAILS_MYSQL_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/upgrade.sql:/docker-entrypoint-initdb.d/03-upgrade.sql:ro
      - ./db/bootstrap.sql:/opt/mindrails/bootstrap.sql:ro
      - ./db/bootstrap.sh:/docker-entrypoint-initdb.d/04-bootstrap.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root
          --execute="SELECT 1 FROM mindrails.chat_memory LIMIT 0; SELECT 1 FROM mindrails.providers LIMIT 0;
          SELECT 1 FROM mindrails.agents LIMIT 0; SELECT 1 FROM mindrails.sessions LIMIT 0;
          SELECT 1 FROM mindrails.history LIMIT 0" >/dev/null
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: mindrails-qdrant
    labels:
      com.mindrails.service: qdrant
    restart: unless-stopped
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r status <&3 && [[ "$$status" == 'HTTP/1.1 200 '* ]]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
    external: ${MINDRAILS_EXTERNAL_DB_VOLUMES:-true}
    name: ${MINDRAILS_MYSQL_VOLUME:-mindrails-mysql-data}
  qdrant-data:
    external: ${MINDRAILS_EXTERNAL_DB_VOLUMES:-true}
    name: ${MINDRAILS_QDRANT_VOLUME:-mindrails-qdrant-data}
