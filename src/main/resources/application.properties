logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# DatabaseProperties. Find usages of getUrl(), getUsername() or getPassword().
mindrails.mysql.url=${MINDRAILS_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/mindrails}
mindrails.mysql.username=${MINDRAILS_MYSQL_USERNAME:mindrails_app}
mindrails.mysql.password=${MINDRAILS_MYSQL_PASSWORD:}

# QdrantProperties. Shared by QdrantAgentMemoryStore and QdrantDocumentStore.
mindrails.qdrant.host=${MINDRAILS_QDRANT_HOST:127.0.0.1}
mindrails.qdrant.port=${MINDRAILS_QDRANT_PORT:6333}
mindrails.qdrant.tls=${MINDRAILS_QDRANT_TLS:false}
mindrails.qdrant.api-key=${MINDRAILS_QDRANT_API_KEY:}
mindrails.qdrant.timeout-millis=${MINDRAILS_QDRANT_TIMEOUT_MILLIS:5000}

# ChatMemoryProperties. ChatMemoryStoreFactory reads getMaxMessages().
mindrails.chat-memory.max-messages=${MINDRAILS_CHAT_MEMORY_MAX_MESSAGES:100}

# AgentMemoryProperties, including nested Retrieval and Qdrant settings.
mindrails.agent-memory.max-entry-chars=${MINDRAILS_AGENT_MEMORY_MAX_ENTRY_CHARS:2000}
mindrails.agent-memory.max-entries=${MINDRAILS_AGENT_MEMORY_MAX_ENTRIES:1000}
mindrails.agent-memory.retrieval.max-results=${MINDRAILS_AGENT_MEMORY_MAX_RESULTS:5}
mindrails.agent-memory.retrieval.max-context-chars=${MINDRAILS_AGENT_MEMORY_MAX_CONTEXT_CHARS:6000}
mindrails.agent-memory.retrieval.min-score=${MINDRAILS_AGENT_MEMORY_MIN_SCORE:0.3}
# Collection is Agent-specific; Knowledge creates its own collections per index generation.
mindrails.agent-memory.qdrant.collection=${MINDRAILS_AGENT_MEMORY_QDRANT_COLLECTION:agent_memory}

# McpProperties. McpClientManager reads stdioEnabled, and McpSecrets reads encryptionKey.
mindrails.mcp.stdio-enabled=${MINDRAILS_MCP_STDIO_ENABLED:true}
mindrails.mcp.encryption-key=${MINDRAILS_MCP_ENCRYPTION_KEY:}

# FileStorageProperties. Find usages of directory(), knowledge(), assets(), assetCache(), skills() or avatars().
mindrails.file-storage.directory=${MINDRAILS_FILE_STORAGE_DIRECTORY:./data}

# KnowledgeProperties. DefaultKnowledgeBaseService uses these values when creating a knowledge base.
mindrails.knowledge.chunk-chars=${MINDRAILS_KNOWLEDGE_CHUNK_CHARS:1200}
mindrails.knowledge.chunk-overlap=${MINDRAILS_KNOWLEDGE_CHUNK_OVERLAP:160}

# Spring Boot multipart request limits.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# AssetStorageProperties. Read by file preview and attachment retrieval.
mindrails.asset-storage.max-preview-bytes=${MINDRAILS_ASSET_MAX_PREVIEW_BYTES:2097152}
mindrails.asset-storage.direct-text-chars=${MINDRAILS_ASSET_DIRECT_TEXT_CHARS:8000}
mindrails.asset-storage.context-chars=${MINDRAILS_ASSET_CONTEXT_CHARS:24000}

# ProviderSecrets reads this key directly. Required Base64-encoded key material.
# Keep the decoded bytes stable so saved credentials remain decryptable.
mindrails.provider.encryption-key=${MINDRAILS_PROVIDER_ENCRYPTION_KEY}

# IdentityProperties. IdentityService reads account and token settings.
# AuthController and HostedFileAccess read the cookie settings.
mindrails.identity.admin-login-id=${MINDRAILS_ADMIN_LOGIN_ID:admin}
# Required: no shared default password. 12–128 characters.
mindrails.identity.admin-password=${MINDRAILS_ADMIN_PASSWORD:}
mindrails.identity.access-seconds=${MINDRAILS_ACCESS_SECONDS:900}
mindrails.identity.refresh-seconds=${MINDRAILS_REFRESH_SECONDS:604800}
mindrails.identity.secure-cookie=${MINDRAILS_SECURE_COOKIE:true}
mindrails.identity.cookie-same-site=${MINDRAILS_COOKIE_SAME_SITE:Lax}
# IdentityProperties.origins() is used by the identity and WebSocket configurations.
# RestCorsConfiguration also reads this key directly.
mindrails.identity.allowed-origins=${MINDRAILS_ALLOWED_ORIGINS:${mindrails.cors.allowed-origins:http://localhost:3000,http://127.0.0.1:3000}}

# logback-spring.xml reads this key directly.
mindrails.logging.error-file=${MINDRAILS_ERROR_LOG_FILE:./mindrails-error.log}
